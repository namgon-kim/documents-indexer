name: document-indexer-dev

services:
  qdrant:
    image: qdrant/qdrant:v1.19.1
    restart: unless-stopped
    ports:
      - "${QDRANT_BIND_ADDRESS:-0.0.0.0}:${QDRANT_HTTP_PORT:-6333}:6333"
    environment:
      - QDRANT__SERVICE__API_KEY
    volumes:
      - qdrant_storage:/qdrant/storage

