[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "document-indexer"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "langchain-core>=1,<2",
  "langchain-qdrant>=1,<2",
  "langgraph>=1,<2",
  "langgraph-checkpoint-sqlite>=3,<4",
  "langsmith>=0.14,<1",
  "olefile>=0.47,<1",
  "openpyxl>=3.1,<4",
  "pillow>=10,<13",
  "pydantic>=2.10,<3",
  "pyhwp>=0.1b15,<0.2",
  "pypdf>=5,<7",
  "python-docx>=1.1,<2",
  "python-multipart>=0.0.20,<1",
  "python-pptx>=1.0,<2",
  "qdrant-client>=1.13,<2",
  "six>=1.16,<2",
  "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.setuptools.packages.find]
where = ["packages/indexer/src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
